services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull qwen2.5:7b && ollama create devassist-gpt -f /Modelfile"
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ../model/Modelfile:/Modelfile:ro
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: devassist-gpt
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data: